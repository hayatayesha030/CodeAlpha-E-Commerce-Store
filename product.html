<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - E-Shop</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        /* Navbar */
        header {
            background: linear-gradient(90deg, #4b4bb7, #5d5dcc);
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 17px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Product Details */
        .product-details {
            max-width: 1100px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);

            display: flex;
            gap: 50px;
            align-items: center;
        }

        .product-image {
            flex: 1;
            text-align: center;
        }

        .product-image img {
            width: 100%;
            max-width: 450px;
            height: 400px;
            object-fit: contain;
        }

        .product-info {
            flex: 1;
        }

        .product-info h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            color: #4b4bb7;
            margin-bottom: 25px;
        }

        .description {
            font-size: 18px;
            line-height: 1.7;
            color: #555;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

        .buttons button {
            border: none;
            padding: 13px 25px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .add-cart {
            background-color: #4b4bb7;
            color: white;
        }

        .back-button {
            background-color: #ddd;
            color: #333;
        }

        .buttons button:hover {
            opacity: 0.85;
        }

        /* Mobile */
        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 15px;
            }

            .product-details {
                margin: 30px 15px;
                padding: 20px;
                flex-direction: column;
                gap: 20px;
            }

            .product-image img {
                height: 280px;
            }

            .product-info {
                text-align: center;
            }

            .product-info h1 {
                font-size: 28px;
            }

            .buttons {
                justify-content: center;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <header>

        <div class="logo">
            E-Shop
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#products">Products</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
        </nav>

    </header>


    <!-- Product Details -->
    <div class="product-details">

        <!-- Product Image -->
        <div class="product-image">

            <img id="product-image"
                 src=""
                 alt="Product">

        </div>


        <!-- Product Information -->
        <div class="product-info">

            <h1 id="product-name">
                Product Name
            </h1>

            <div class="price" id="product-price">
                Rs. 0
            </div>

            <p class="description" id="product-description">
                Product description
            </p>

            <div class="buttons">

                <button class="add-cart"
                        id="add-cart-button">
                    Add to Cart
                </button>

                <button class="back-button"
                        onclick="window.location.href='index.html#products'">
                    Back to Products
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

    <script>

        const products = {

            hair: {
                name: "Hair Straightener",
                image: "images/hair-straightner.png",
                price: 5000,
                description:
                    "Fast and easy hair straightener with a stylish design. It helps you achieve smooth, straight and beautiful hair quickly. Perfect for everyday styling and easy to use."
            },

            watch: {
                name: "Smart Watch",
                image: "images/smart-watch.png",
                price: 4000,
                description:
                    "Stylish smart watch with useful features for everyday activities. It has a modern design and is a great choice for staying connected while tracking your daily activities."
            },

            shoes: {
                name: "Running Shoes",
                image: "images/running-shoes.png",
                price: 4000,
                description:
                    "Comfortable and lightweight running shoes designed for daily activities and exercise. They provide a stylish look along with comfort for walking, running and everyday use."
            },

            tshirt: {
                name: "Sky Blue T-Shirt",
                image: "images/T-shirt.png",
                price: 2000,
                description:
                    "Comfortable casual sky blue T-shirt with a soft and stylish design. Perfect for everyday wear, casual outings and relaxed activities."
            },

            case: {
                name: "Floral Phone Case",
                image: "images/phone-case.png",
                price: 1500,
                description:
                    "Stylish protective phone case with a beautiful floral design. It provides protection for your phone while giving it an attractive and fashionable look."
            },

            wallet: {
                name: "Minimalist Wallet",
                image: "images/wallet.png",
                price: 1500,
                description:
                    "Compact and elegant wallet with a modern design for cards and everyday essentials. Its simple design makes it convenient for everyday use."
            }

        };


        // Get product name from URL
        const urlParams = new URLSearchParams(window.location.search);

        const productId = urlParams.get("product");


        // Select product
        const product = products[productId];


        if (product) {

            document.getElementById("product-image").src =
                product.image;

            document.getElementById("product-image").alt =
                product.name;

            document.getElementById("product-name").textContent =
                product.name;

            document.getElementById("product-price").textContent =
                "Rs. " + product.price.toLocaleString();

            document.getElementById("product-description").textContent =
                product.description;


            // Add to Cart
            document.getElementById("add-cart-button").onclick =
                function () {

                    addToCart(product.name, product.price);

                };

        } else {

            document.getElementById("product-name").textContent =
                "Product Not Found";

            document.getElementById("product-description").textContent =
                "Sorry, the product you are looking for was not found.";

            document.getElementById("product-price").textContent =
                "";

            document.getElementById("product-image").style.display =
                "none";

            document.getElementById("add-cart-button").style.display =
                "none";
        }

    </script>

</body>

</html>
